<script>
/* 手機被設成「電腦版網站」時，畫面會被縮成一半。偵測到就自動放大回手機尺寸 */
(function fitPhone() {
  function apply() {
    var sw = Math.min(screen.width, screen.height), iw = window.innerWidth;
    var touch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
    var z = 1;
    if (touch && sw < 600 && iw > sw * 1.25) z = iw / sw;
    document.documentElement.style.zoom = z === 1 ? '' : String(z);
    document.documentElement.style.setProperty('--z', String(z));
    // 版面寬度判斷一律用「放大後的實際寬度」：電腦版網站模式下，瀏覽器回報 980px，但畫面其實是手機寬
    var ew = iw / z, c = document.documentElement.classList;
    c.toggle('mq-max400', ew <= 400); c.toggle('mq-max370', ew <= 370);
    c.toggle('mq-min560', ew >= 560); c.toggle('mq-min900', ew >= 900);
  }
  apply();
  window.addEventListener('resize', function () { document.documentElement.style.zoom = ''; apply(); });
})();
</script>

  .pg-dot.working { background: var(--sage); } .pg-dot.off { background: var(--mist); } .pg-dot.leave { background: var(--rose); }
  .pg-tg, .pg-clear { font-size: 13px; color: var(--rose-deep); background: var(--rose-tint); border: 0; border-radius: 999px; padding: 4px 11px; font-family: inherit; cursor: pointer; white-space: nowrap; letter-spacing: 0; }

<script>
/* ===== 設定（與打卡 App 相同） ===== */
const LIFF_ID = '2012013365-WKHpgfeS';
const API_URL = 'https://script.google.com/macros/s/AKfycbxESEJ8gfFwQofHSGNUUr4hoCup0WOSjhejmHw4lvyKegq4WYOcSVInVtFQeUOJpTDulg/exec';
/* ================================== */
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const WEEK = '日一二三四五六';
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let ME = null, curTab = '', range = 'today', abnOnly = false, month = '', lastRecs = [], lastHours = [];

/* ---------- 啟動 ---------- */
(async function start() {
  bindUI();
  try {
    if (DEMO) $('demoBar').classList.remove('hidden');
    else {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href.split('#')[0] }); return; }
    }
    const r = await api({ action: 'q_me' });
    if (!r.ok) return showState(r.message || '讀取失敗');
    ME = r.me;
    document.body.classList.toggle('is-admin', ME.admin);
    document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !ME.admin));
    $('rolePill').textContent = ME.admin ? '主管・' + ME.name : ME.name;
    $('rolePill').classList.toggle('admin', ME.admin);
    $('rolePill').classList.remove('hidden');
    if (!ME.admin) { $('recTitle').textContent = '我的打卡紀錄'; $('recSub').textContent = '只顯示你自己的紀錄'; $('hrTitle').textContent = '我的工時'; }
    fillSelect($('fName'), r.staff, '全部人員');
    fillSelect($('hName'), r.staff, '全部人員');
    fillSelect($('fStore'), r.stores, '全部櫃點');
    const now = new Date(); month = now.getFullYear() + '-' + pad(now.getMonth() + 1);
    $('fFrom').value = $('fTo').value = ymd(now);
    $('stateView').classList.add('hidden');
    $('nav').classList.remove('hidden');
    let tab = ME.admin ? 'today' : 'records';
    try { tab = sessionStorage.getItem('qTab') || tab; } catch (e) {}
    if ((tab === 'today' || tab === 'staff') && !ME.admin) tab = 'records';
    STORES = r.stores || [];
    $('fixOpen').classList.remove('hidden');
    if (ME.admin) { badgeN.staff = r.pending || 0; badgeN.fix = r.fixPending || 0; setPendBadge(); }
    let wantFix = new URLSearchParams(location.search).has('fix');
    try { if (sessionStorage.getItem('openFix')) { wantFix = true; sessionStorage.removeItem('openFix'); } } catch (e) {}
    if (wantFix) {
      tab = 'records';
      setTimeout(openFixForm, 400);
      try { history.replaceState(null, '', location.pathname + location.search.replace(/[?&]fix=1/, '').replace(/^&/, '?')); } catch (e) {}
    }
    showTab(tab);
  } catch (e) {
    showState('無法啟動：' + esc(e.message || e));
  }
})();

function fillSelect(sel, list, allLabel) {
  sel.innerHTML = '<option value="">' + allLabel + '</option>' + (list || []).map(n => '<option>' + esc(n) + '</option>').join('');
}

const TAB_ORDER = ['today', 'records', 'hours', 'staff'];
function moveIndicator() {
  const on = document.querySelector('nav button.on'), tabs = document.querySelector('nav .tabs');
  if (!on || !tabs) return;
  tabs.style.setProperty('--ix', on.offsetLeft + 'px'); tabs.style.setProperty('--iw', on.offsetWidth + 'px');
  tabs.classList.add('has-ind');
}
function showTab(tab) {
  const prev = curTab;
  curTab = tab;
  try { sessionStorage.setItem('qTab', tab); } catch (e) {}
  ['today', 'records', 'hours', 'staff'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== tab));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  moveIndicator();
  const sec = $('tab-' + tab);
  if (prev && prev !== tab && !REDUCED) {
    sec.classList.remove('slide-l', 'slide-r'); void sec.offsetWidth;
    sec.classList.add(TAB_ORDER.indexOf(tab) > TAB_ORDER.indexOf(prev) ? 'slide-l' : 'slide-r');
  }
  window.scrollTo(0, 0);
  if (tab === 'today') loadToday();
  if (tab === 'records') loadRecords();
  if (tab === 'hours') loadHours();
  if (tab === 'staff') loadStaff();
}

/* ---------- 骨架畫面（讀取中） ---------- */
function skel(kind) {
  const line = (w, h) => '<i class="sk" style="width:' + w + ';height:' + (h || 12) + 'px"></i>';
  if (kind === 'people') return Array(5).fill(0).map(() =>
    '<div class="person sk-row"><i class="sk av pav"></i><div class="nm">' + line('38%', 15) + '</div><div class="st">' + line('52%') + '</div><div class="tm">' + line('62px', 14) + '<br>' + line('62px', 14) + '</div></div>').join('');
  return Array(3).fill(0).map(() => '<div class="card sk-card">' + line('30%', 14) + '<div style="height:14px"></div>' + line('90%') + '<div style="height:10px"></div>' + line('70%') + '<div style="height:10px"></div>' + line('80%') + '</div>').join('');
}

/* ---------- 人員頭像（姓名第一個字＋固定配色） ---------- */
const AV_COLORS = [['#E3E7DF', '#6F7E6B'], ['#E3E7EC', '#6E7B8D'], ['#F3E5E3', '#A3706A'], ['#EEE7F2', '#7C6A89'], ['#F3ECDF', '#9A7B55'], ['#E0ECEA', '#5E827C']];
function avatar(name, cls) {
  const n = String(name || '?').trim(); let h = 0;
  for (const ch of n) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const c = AV_COLORS[h % AV_COLORS.length];
  const ch = /^[A-Za-z]/.test(n) ? n[0].toUpperCase() : Array.from(n)[0];
  const dark = document.documentElement.getAttribute('data-mode') === 'dark';
  const bg = dark ? 'color-mix(in srgb,' + c[1] + ' 34%,var(--paper))' : c[0];
  const fg = dark ? 'color-mix(in srgb,' + c[1] + ' 45%,#fff)' : c[1];
  return '<span class="av ' + (cls || '') + '" style="background:' + bg + ';color:' + fg + '">' + esc(ch) + '</span>';
}

/* ---------- 今日 ---------- */
async function loadToday() {
  $('peopleList').innerHTML = skel('people');
  const r = await api({ action: 'q_today' });
  if (!r.ok) return $('peopleList').innerHTML = emptyBox(r.message);
  // 缺卡也算異常：有下班卡卻沒有上班卡；上班超過 12 小時（或過了晚上 11 點）還沒打下班卡
  const nowD = new Date(), nowMin = nowD.getHours() * 60 + nowD.getMinutes();
  r.people.forEach(p => {
    if (p.outTime && !p.inTime) { p.abnormal = (p.abnormal || []).concat([p.outTime + ' 下班：沒有上班打卡紀錄，可請她申請補卡']); r.counts.abnormal++; }
    const m = /^(\d{1,2}):(\d{2})$/.exec(p.inTime || '');
    if (p.state === 'working' && m && (nowMin - (+m[1] * 60 + +m[2]) >= 12 * 60 || nowMin >= 23 * 60)) {
      p.abnormal = (p.abnormal || []).concat([p.inTime + ' 上班：已經很晚還沒打下班卡，可能忘記打了']); r.counts.abnormal++;
    }
  });
  loadYesterdayMissing();
  const d = new Date(r.date + 'T00:00:00');
  $('todayDate').textContent = r.date.replace(/-/g, '.') + '　週' + WEEK[d.getDay()];
  countUp($('cWorking'), r.counts.working); countUp($('cOff'), r.counts.off);
  countUp($('cNone'), r.counts.none); countUp($('cAbn'), r.counts.abnormal);
  $('statAbn').classList.toggle('has', r.counts.abnormal > 0);
  const tot = r.counts.working + r.counts.off + r.counts.none || 1, bar = $('ratioBar').children;
  $('leaveTxt').textContent = r.counts.leave ? '休假 ' + r.counts.leave : '';
  $('leaveTxt').classList.toggle('hidden', !r.counts.leave);
  bar[0].style.flex = r.counts.working; bar[1].style.flex = r.counts.off; bar[2].style.flex = r.counts.none;
  $('ratioTxt').textContent = '到班率 ' + Math.round((r.counts.working + r.counts.off) / tot * 100) + '%';
  lastToday = r;
  renderToday();
}

/* 昨天缺卡：上班沒打或下班沒打的人，列在今日頁上方（資料來自工時統計） */

/* 今日名單：分組（上班中／已下班／未打卡／休假）、時間軸、點數字格篩選 */
let lastToday = null, todayFilter = '', leaveOpen = false;
function renderToday() {
  const r = lastToday; if (!r) return;
  const label = { working: '上班中', off: '已下班', none: '未打卡', leave: '休假' };
  document.querySelectorAll('.stats .stat').forEach(el => el.classList.toggle('sel', el.dataset.f === todayFilter));
  document.querySelector('.stats').classList.toggle('filtering', !!todayFilter);
  // 時間軸範圍：預設 10:00–22:00，有人更早到或更晚走就自動放寬
  const toM = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
  const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
  let t0 = 600, t1 = 1320;
  r.people.forEach(p => { const a = toM(p.inTime), b = toM(p.outTime); if (a !== null) t0 = Math.min(t0, Math.floor(a / 60) * 60); if (b !== null) t1 = Math.max(t1, Math.ceil(b / 60) * 60); });
  if (r.people.some(p => p.state === 'working')) t1 = Math.max(t1, Math.ceil(nowM / 60) * 60);
  const pct = m => Math.max(0, Math.min(100, (m - t0) / (t1 - t0) * 100));
  const ticks = []; for (let h = Math.ceil(t0 / 60) + 1; h * 60 < t1; h++) if (h % 2 === 0) ticks.push(h);
  const labTicks = ticks.filter(h => pct(h * 60) > 9 && pct(h * 60) < 91);   // 頭尾留給起訖時間，避免數字疊在一起
  const showNow = nowM > t0 && nowM < t1;
  const tl = p => {
    const a = toM(p.inTime); if (a === null) return '';
    const b = p.state === 'working' ? nowM : toM(p.outTime); if (b === null) return '';
    return '<div class="tl"><div class="tl-tr">' + ticks.map(h => '<i style="left:' + pct(h * 60) + '%"></i>').join('') +
      (showNow ? '<b class="tl-nl" style="left:' + pct(nowM) + '%"></b>' : '') +
      '<span class="tl-seg ' + p.state + '" style="left:' + pct(a) + '%;width:' + Math.max(1.5, pct(b) - pct(a)) + '%"></span>' +
      (p.state === 'working' ? '<span class="tl-now" style="left:' + pct(nowM) + '%"></span>' : '') + '</div></div>';
  };
  const hh = m => String(Math.floor(m / 60));
  $('tlScale').innerHTML = '<span class="e l">' + hh(t0) + '</span>' + labTicks.map(h => '<span style="left:' + pct(h * 60) + '%">' + h + '</span>').join('') +
    '<span class="e r">' + hh(t1) + '</span>' + (showNow ? '<em class="tl-nowlbl" style="left:' + pct(nowM) + '%">現在</em>' : '');
  const row = p =>
    '<div class="person fadein">' + avatar(p.name, 'pav') + '<div class="nm"><span class="nmx">' + esc(p.name) + '</span><span class="state s1 ' + p.state + '">' + label[p.state] + '</span></div>' +
    '<div class="st"><span class="state s2 ' + p.state + '">' + label[p.state] + '</span><span class="sto">' + (p.store ? esc(p.store) : p.state === 'leave' ? '今日休假' : '尚未選擇櫃點') + '</span></div>' +
    '<div class="tm">上 <b class="num">' + (p.inTime || '--:--') + '</b><br>下 <b class="num">' + (p.outTime || '--:--') + '</b></div>' +
    photoBtn(p.name + '・今天', [{ label: '上班', time: p.inTime, id: p.inPhoto }, { label: '下班', time: p.outTime, id: p.outPhoto }]) + tl(p) +
    (p.abnormal.length ? '<div class="ab">' + p.abnormal.map(abLine).join('') + '</div>' : '') + '</div>';
  if (!r.people.length) return $('peopleList').innerHTML = emptyBox('還沒有已開通的人員');
  let list = r.people;
  if (todayFilter === 'abn') list = list.filter(p => p.abnormal.length);
  else if (todayFilter) list = list.filter(p => p.state === todayFilter);
  if (todayFilter) {
    $('peopleList').innerHTML = '<div class="pg-h only"><span>' + ({ working: '上班中', off: '已下班', none: '未打卡', abn: '有異常' })[todayFilter] + '・' + list.length + ' 人</span><button class="pg-clear" type="button">顯示全部</button></div>' +
      (list.length ? list.map(row).join('') : emptyBox(todayFilter === 'abn' ? '今天沒有異常' : '沒有符合的人員', todayFilter === 'abn' ? 'happy' : 'calm'));
  } else {
    $('peopleList').innerHTML = ['working', 'off', 'none', 'leave'].map(st => {
      const g = list.filter(p => p.state === st); if (!g.length) return '';
      const fold = st === 'leave' && !leaveOpen;
      return '<div class="pg-h' + (st === 'leave' ? ' tg' : '') + '" data-g="' + st + '"><span><i class="pg-dot ' + st + '"></i>' + label[st] + '・' + g.length + ' 人</span>' +
        (st === 'leave' ? '<span class="pg-tg">' + (fold ? '展開' : '收合') + '</span>' : '') + '</div>' + (fold ? '' : g.map(row).join(''));
    }).join('');
  }
  const clr = $('peopleList').querySelector('.pg-clear'); if (clr) clr.onclick = () => { buzz(6); todayFilter = ''; renderToday(); };
  const tg = $('peopleList').querySelector('.pg-h.tg'); if (tg) tg.onclick = () => { buzz(6); leaveOpen = !leaveOpen; renderToday(); };
}

/* 異常說明：「11:08 上班」＋說明；小螢幕自動分兩行 */
function abLine(t) {
  const i = String(t).indexOf('：');
  if (i < 0) return '<div class="abl"><span>' + esc(t) + '</span></div>';
  return '<div class="abl"><b>' + esc(t.slice(0, i)) + '</b><span>' + esc(t.slice(i + 1)) + '</span></div>';
}

/* 觸感回饋（Android 有感；iPhone 網頁不支援震動，會自動略過） */
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }

/* 今日頁下拉更新：往下拉，鬧鐘寶寶搖一搖，放開就重新整理 */
function initPull() {
  const ind = document.createElement('div'); ind.className = 'ptr';
  ind.innerHTML = '<div class="ptr-m">' + window.UC_MASCOT('calm') + '</div><span>下拉更新</span>';
  document.body.appendChild(ind);
  let y0 = null, dy = 0, busy = false;
  const TH = 70;
  document.addEventListener('touchstart', e => {
    if (busy || curTab !== 'today' || scrollY > 0 || document.querySelector('.cf, .pm, .thm.open')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0) { ind.style.transform = ''; ind.classList.remove('show'); return; }
    const d = Math.min(110, dy * .5);
    ind.classList.add('show'); ind.classList.toggle('ready', dy > TH * 1.6);
    ind.style.transform = 'translate(-50%,' + (d - 70) + 'px)';
    ind.querySelector('span').textContent = dy > TH * 1.6 ? '放開更新' : '下拉更新';
  }, { passive: true });
  document.addEventListener('touchend', async () => {
    if (y0 === null) return;
    const go = dy > TH * 1.6; y0 = null;
    if (!go) { ind.style.transform = ''; ind.classList.remove('show', 'ready'); return; }
    busy = true; buzz(10);
    ind.classList.add('loading'); ind.querySelector('span').textContent = '更新中…';
    ind.style.transform = 'translate(-50%, 0px)';
    await loadToday();
    ind.querySelector('span').textContent = '已更新';
    setTimeout(() => { ind.style.transform = ''; ind.classList.remove('show', 'ready', 'loading'); busy = false; }, 500);
  });
}

/* 數字跳動：0 → 目標值（小數保留一位） */
function countUp(el, to, ms) {
  to = Number(to) || 0;
  const dec = String(to).indexOf('.') >= 0 ? 1 : 0;
  if (REDUCED || !to) { el.textContent = to.toFixed(dec); return; }
  const t0 = performance.now(), dur = ms || 700;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = (to * e).toFixed(dec);
    if (k < 1) requestAnimationFrame(step); else el.textContent = to.toFixed(dec);
  };
  requestAnimationFrame(step);
}

/* ---------- 紀錄 ---------- */
function rangeDates() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  if (range === 'today') return [t, t];
  if (range === 'yesterday') { const y = add(t, -1); return [y, y]; }
  if (range === '7d') return [add(t, -6), t];
  if (range === 'month') return [new Date(t.getFullYear(), t.getMonth(), 1), t];
  if (range === 'lastmonth') return [new Date(t.getFullYear(), t.getMonth() - 1, 1), new Date(t.getFullYear(), t.getMonth(), 0)];
  let a = $('fFrom').value || $('fTo').value || ymd(t), b = $('fTo').value || a;
  if (a > b) { [a, b] = [b, a]; $('fFrom').value = a; $('fTo').value = b; }
  return [new Date(a + 'T00:00:00'), new Date(b + 'T00:00:00')];
}

// 目前畫面條件的代號：用來判斷匯出的資料是不是跟畫面選的一致
function recKey() { const [f, t] = rangeDates(); return [ymd(f), ymd(t), $('fName').value, $('fStore').value, abnOnly].join('|'); }
let recSeq = 0, lastRecKey = '';
async function loadRecords() {
  if (!ME.admin) loadFixMine();
  const [f, t] = rangeDates(), key = recKey(), seq = ++recSeq;
  $('recList').innerHTML = skel('cards');
  $('recCount').textContent = '';
  const r = await api({ action: 'q_records', from: ymd(f), to: ymd(t),
                        name: $('fName').value, store: $('fStore').value, abnormal: abnOnly });
  if (seq !== recSeq) return;   // 較早送出的查詢比較晚回來，丟掉，避免蓋掉新結果
  if (!r.ok) { lastRecs = []; lastRecKey = ''; return $('recList').innerHTML = emptyBox(r.message); }
  lastRecs = r.records || []; lastRecKey = key;
  $('recCount').textContent = r.message ? r.message : '共 ' + lastRecs.length + ' 筆' + (r.truncated ? '（只顯示最近 1500 筆）' : '');
  if (!lastRecs.length) return $('recList').innerHTML = '<div class="card">' + (abnOnly ? emptyBox('這段期間沒有異常紀錄', 'happy') : emptyBox('這段期間沒有打卡紀錄')) + '</div>';
  const groups = {};
  lastRecs.forEach(x => (groups[x.date] = groups[x.date] || []).push(x));
  $('recList').innerHTML = Object.keys(groups).map(date => {
    const d = new Date(date + 'T00:00:00');
    return '<div class="card day fadein"><h3><span class="num">' + date.slice(5).replace('-', '.') + '</span><span>週' + WEEK[d.getDay()] + '・' + groups[date].length + ' 筆</span></h3>' +
      groups[date].map(recRow).join('') + '</div>';
  }).join('');
}

function recRow(x) {
  const fix = x.verdict === '補登', bad = x.verdict && x.verdict !== '正常' && !fix;
  const tags = '<span class="tag' + (bad ? ' bad' : fix ? ' fix' : '') + '">' + esc(x.verdict || '—') + '</span>' +
    (x.warn ? x.warn.split('、').map(w => '<span class="tag warn">' + esc(w) + '</span>').join('') : '');
  const ph = x.photoId ? photoBtn(x.name + '・' + x.date.slice(5).replace('-', '/'), [{ label: x.type, time: x.time, id: x.photoId }]).replace('class="pbtn"', 'class="pbtn ph"') : '<span></span>';
  return '<div class="rec"><div class="t">' + esc(x.time) + '</div>' +
    '<div class="who"><span class="dot ' + (x.type === '上班' ? 'in' : 'out') + '"></span>' + esc(x.type) + (ME.admin ? '・' + esc(x.name) : '') + '</div>' +
    ph + '<div class="where">' + esc(x.store) + '</div><div class="tags">' + tags + '</div></div>';
}

/* ---------- 工時 ---------- */
async function loadHours() {
  $('mLabel').textContent = month.replace('-', '.');
  $('hrList').innerHTML = skel('cards');
  $('hrCount').textContent = '';
  const r = await api({ action: 'q_hours', month: month, name: $('hName').value });
  if (!r.ok) return $('hrList').innerHTML = emptyBox(r.message);
  lastHours = r.people || [];
  $('hrCount').textContent = ME.admin && lastHours.length ? lastHours.length + ' 位' : '';
  if (!lastHours.length) return $('hrList').innerHTML = '<div class="card">' + emptyBox('這個月還沒有打卡紀錄', 'calm') + '</div>';
  const single = lastHours.length === 1;
  const maxH = Math.max.apply(null, lastHours.map(p => p.totalHours).concat([1]));
  const worked = lastHours.filter(p => p.totalHours > 0);
  const avgH = worked.length ? Math.round(worked.reduce((t, p) => t + p.totalHours, 0) / worked.length * 10) / 10 : 0;
  const avgP = avgH / maxH * 100;
  const overview = single ? '' : '<div class="card chart fadein"><div class="chart-h"><span>本月總工時</span>' + (avgH ? '<span class="avg-lg"><i></i>平均 <b class="num">' + avgH + '</b></span>' : '') + '</div>' +
    lastHours.slice().sort((a, b) => b.totalHours - a.totalHours).map(p =>
      '<div class="hbar">' + avatar(p.name, 'sm') + '<span class="hb-n">' + esc(p.name) + '</span>' +
      '<span class="hb-t"><span data-w="' + (p.totalHours / maxH * 100) + '"></span>' + (avgH ? '<i class="avg" style="left:' + avgP + '%"></i>' : '') + '</span>' +
      '<span class="hb-v num" data-cnt="' + p.totalHours + '">0</span></div>').join('') + '</div>';
  $('hrList').innerHTML = overview + lastHours.map(p =>
    '<div class="card hp fadein' + (single ? ' open' : '') + '"><div class="hp-top"><span class="nm">' + avatar(p.name) + esc(p.name) + '</span>' +
    ((p.leaves || []).length ? '<span class="lvn">休 ' + p.leaves.length + ' 天</span>' : '') +
    '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>' +
    '<div class="kpis"><div class="kpi"><div class="v" data-cnt="' + p.workDays + '">0</div><div class="k">出勤天數</div></div>' +
    '<div class="kpi"><div class="v" data-cnt="' + p.totalHours + '">0</div><div class="k">總工時</div>' + deltaTag(p) + '</div>' +
    '<div class="kpi' + (p.missing ? ' miss' : '') + '"><div class="v" data-cnt="' + p.missing + '">0</div><div class="k">缺卡</div></div></div>' +
    '<div class="dlist">' + calendar(p) + p.days.map(d => (curHoursName = p.name, dayRow(d))).join('') + '</div></div>'
  ).join('');
  document.querySelectorAll('.hp-top').forEach(el => el.onclick = () => el.parentElement.classList.toggle('open'));
  // 進場動畫：數字由 0 跳到實際值、長條由左往右長出來
  $('hrList').querySelectorAll('[data-cnt]').forEach(el => countUp(el, Number(el.dataset.cnt)));
  requestAnimationFrame(() => requestAnimationFrame(() =>
    $('hrList').querySelectorAll('.hb-t span[data-w]').forEach((el, i) => { el.style.transitionDelay = (i * 60) + 'ms'; el.style.width = el.dataset.w + '%'; })));
  document.querySelectorAll('.cal .cd[data-d]').forEach(el => el.onclick = () => { buzz(6); dayDetail(el.dataset.n, el.dataset.d); });
}

/* 和上個月比較：比上月 +3.2h／-1.5h／持平 */
function deltaTag(p) {
  if (p.prevHours === null || p.prevHours === undefined) return '';
  const d = Math.round((p.totalHours - p.prevHours) * 10) / 10;
  if (!p.prevHours && !p.totalHours) return '';
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'eq';
  return '<div class="dl ' + cls + '">' + (d === 0 ? '與上月持平' : '比上月 ' + (d > 0 ? '+' : '−') + Math.abs(d) + 'h') + '</div>';
}

/* 點日曆上的日期：顯示那天的上下班、工時、櫃點；主管可看照片、標記／取消休假 */
function dayDetail(name, date) {
  const p = lastHours.find(x => x.name === name); if (!p) return;
  const x = p.days.find(d => d.date === date), isLeave = (p.leaves || []).indexOf(date) >= 0;
  const dt = new Date(date + 'T00:00:00');
  const title = date.slice(5).replace('-', '/') + '（週' + WEEK[dt.getDay()] + '）';
  let body = '';
  if (x) {
    body = '<div class="dd-io"><div><span class="lb"><span class="dot in"></span>上班</span><b class="num">' + esc(x.in || '--:--') + '</b></div>' +
      '<div><span class="lb"><span class="dot out"></span>下班</span><b class="num">' + esc(x.out || '--:--') + '</b></div></div>' +
      '<div class="dd-row"><span>工時</span><b>' + (x.hours !== null ? x.hours + ' 小時' : '—') + '</b></div>' +
      '<div class="dd-row"><span>櫃點</span><b>' + esc(x.store || '—') + '</b></div>' +
      (x.flag || x.abnormal ? '<div class="dd-tags">' + (x.flag ? '<span class="tag ' + (x.flag === '上班中' ? '' : 'bad') + '">' + esc(x.flag) + '</span>' : '') +
        (x.abnormal ? '<span class="tag warn">有異常</span>' : '') + '</div>' : '');
  } else if (isLeave) body = '<div class="dd-empty">' + window.UC_MASCOT('sleep') + '這天是休假</div>';
  else body = '<div class="dd-empty">' + window.UC_MASCOT('calm') + '這天沒有打卡紀錄</div>';
  const acts = [];
  if (ME.admin && x && (x.inPhoto || x.outPhoto)) acts.push('<button class="sbtn" data-dd="photo">查看照片</button>');
  if (ME.admin && !x) acts.push('<button class="sbtn go" data-dd="leave">' + (isLeave ? '取消休假' : '標記休假') + '</button>');
  if (!ME.admin && x && x.flag && x.flag !== '上班中') acts.push('<button class="sbtn go" data-dd="fix">申請補卡</button>');
  const w = document.createElement('div'); w.className = 'cf dd';
  w.innerHTML = '<div class="cf-card dd-card"><div class="dd-h"><span>' + (ME.admin ? avatar(name, 'sm') + esc(name) + '・' : '') + title + '</span>' +
    '<button class="pm-x dd-x" aria-label="關閉">×</button></div>' + body +
    (acts.length ? '<div class="dd-b">' + acts.join('') + '</div>' : '') + '</div>';
  document.body.appendChild(w);
  const close = () => w.remove();
  w.onclick = e => { if (e.target === w || e.target.classList.contains('dd-x')) close(); };

/* 月曆：每天依工時深淺上色，缺卡紅框、有異常加橘點 */
function calendar(p) {
  const [y, m] = month.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
  const map = {}; p.days.forEach(d => map[Number(d.date.slice(8))] = d);
  const lv = {}; (p.leaves || []).forEach(x => lv[Number(x.slice(8))] = true);
  const today = new Date(), isCur = today.getFullYear() === y && today.getMonth() + 1 === m;
  let cells = '日一二三四五六'.split('').map(w => '<span class="cw">' + w + '</span>').join('');
  for (let i = 0; i < first; i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const x = map[d]; let cls = 'cd', style = '';
    if (x) {
      if (x.hours) { const a = Math.min(1, x.hours / 10); style = 'background:rgba(111,126,107,' + (0.18 + a * 0.62).toFixed(2) + ');color:' + (a > .55 ? '#fff' : 'var(--ink)'); }
      if (x.flag && x.flag !== '上班中') cls += ' miss';
      if (x.flag === '上班中') cls += ' live';
      if (x.abnormal) cls += ' abn';
    } else if (lv[d]) cls += ' lv';
    else if (isCur && d > today.getDate()) cls += ' fut';
    if (isCur && d === today.getDate()) cls += ' now';
    const fut = isCur && d > today.getDate();
    const canTap = x || lv[d] || (ME.admin && !fut);
    const key = canTap ? ' data-n="' + esc(p.name) + '" data-d="' + month + '-' + pad(d) + '" role="button" tabindex="0" aria-label="' + m + '月' + d + '日"' : '';
    if (key) cls += ' tap';
    cells += '<span class="' + cls + '" style="' + style + ';--i:' + (first + d) + '"' + key + '>' + d + '</span>';
  }
  return '<div class="cal">' + cells + '</div><div class="cal-lg"><span><i class="l1"></i>工時短</span><span><i class="l2"></i>工時長</span><span><i class="lm"></i>缺卡</span>' + (ME.admin ? '<span><i class="la"></i>有異常</span>' : '') + '<span><i class="lv"></i>休假</span></div>' +
    '<div class="cal-tip">' + (ME.admin ? '點日期看詳細，沒有打卡的日期可以標記休假' : '點日期可以看那天的上下班時間') + '</div>';
}

  return '<div class="drow"><div class="d">' + d.date.slice(5).replace('-', '/') + ' 週' + WEEK[dt.getDay()] + '</div>' +

function downloadCSV(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function exportRecords() {

  $('hrExport').onclick = exportHours;

  window.addEventListener('resize', moveIndicator);

  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][tabindex]')) { e.preventDefault(); e.target.click(); } });
  // 捲動：頂端變毛玻璃，大標題捲出去後縮進頂端
  const onScroll = () => {

}
function shiftMonth(n) {
  const [y, m] = month.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  month = d.getFullYear() + '-' + pad(d.getMonth() + 1);
  loadHours();
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- 後端 ---------- */
async function api(payload) {
  if (DEMO) return demoApi(payload);
  try {
    const dec = liff.getDecodedIDToken();
    if (dec && dec.exp * 1000 < Date.now() + 60000) return relogin();
  } catch (e) {}
  payload.idToken = liff.getIDToken();
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 30000);
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), signal: ctrl.signal });
    const r = await res.json();
    if (r.code === 'AUTH') return relogin();
    if (r.message && /尚未開通/.test(r.message)) showState(esc(r.message) + '<br><small>請先在打卡 App 完成登記並由主管開通</small>');
    return r;
  } catch (e) {
    return { ok: false, message: e && e.name === 'AbortError' ? '連線逾時，網路可能不穩，請稍後再試' : '網路錯誤，請稍後再試' };
  }
}
function relogin() {
  let last = 0;
  try { last = Number(sessionStorage.getItem('reloginAt') || 0); } catch (e) {}
  if (Date.now() - last < 120000) return { ok: false, message: 'LINE 登入驗證沒有通過，請關閉後重新開啟' };
  try { sessionStorage.setItem('reloginAt', String(Date.now())); } catch (e) {}
  try { liff.logout(); } catch (e) {}
  liff.login({ redirectUri: location.href.split('#')[0] });
  return new Promise(() => {});
}

  g.fillStyle = out ? '#C9CED6' : '#D8CBB8'; g.fillRect(0, 0, 480, 640);
  g.fillStyle = '#7a6a5a'; g.fillRect(60, 300, 360, 260); g.fillStyle = '#efe6d8'; g.fillRect(110, 120, 260, 110);
  g.fillStyle = '#4b3f3d'; g.font = 'bold 44px sans-serif'; g.textAlign = 'center'; g.fillText('UCHINO', 240, 192);
  g.font = '28px sans-serif'; g.fillText(out ? '下班照片（示範）' : '上班照片（示範）', 240, 610);

}
const DEMO_LEAVE = {};

const DEMO_STAFF = [
  { key: 'U1', lineName: 'Amy 🌸', name: '', status: '待審核', since: '2026-10-15' },
  { key: 'U2', lineName: 'Ryan', name: 'Ryan', status: '啟用' }, { key: 'U3', lineName: 'mei.wang', name: '王小美', status: '啟用' },
  { key: 'U4', lineName: 'Jia Hui', name: '林佳慧', status: '啟用' }, { key: 'U5', lineName: '怡君', name: '陳怡君', status: '啟用' },
  { key: 'U6', lineName: 'Tina', name: '張雅婷', status: '啟用' }, { key: 'U7', lineName: 'Peiyu', name: '李珮瑜', status: '停用' }];
function demoApi(p) {
  const asStaff = new URLSearchParams(location.search).get('demo') === 'staff';
  const today = ymd(new Date());
  const people = ['王小美', '林佳慧', '陳怡君', '張雅婷', '李珮瑜', '黃詩涵'];
  const me = asStaff ? { name: '王小美', admin: false } : { name: 'Ryan', admin: true };
  return new Promise(res => setTimeout(() => {
    if (p.action === 'q_staff') return res({ ok: true, me, people: DEMO_STAFF });
    if (p.action === 'q_fixlist') return res({ ok: true, list: asStaff ? DEMO_FIX.filter(f => f.name === '王小美') : DEMO_FIX });
    if (p.action === 'q_fixreq') { DEMO_FIX.unshift({ id: 'F' + Date.now(), name: '王小美', date: p.date, time: p.time, type: p.type, store: p.store, reason: p.reason, status: '待審核', note: '' }); return res({ ok: true, list: DEMO_FIX.filter(f => f.name === '王小美') }); }
    if (p.action === 'q_fixdo') { const f = DEMO_FIX.find(x => x.id === p.id); if (f) { f.status = p.approve ? '已核准' : '已退回'; f.note = p.note || ''; } return res({ ok: true, list: DEMO_FIX }); }
    if (p.action === 'q_setstaff') { const x = DEMO_STAFF.find(s => s.key === p.key); if (x) { x.status = p.status; if (p.name) x.name = p.name; } return res({ ok: true, people: DEMO_STAFF }); }
    if (p.action === 'q_leave') { const k = p.name + p.date; if (p.on) DEMO_LEAVE[k] = 1; else delete DEMO_LEAVE[k]; return res({ ok: true }); }
    if (p.action === 'q_me') return res({ ok: true, me, pending: asStaff ? 0 : DEMO_STAFF.filter(s => s.status === '待審核').length, fixPending: asStaff ? 0 : DEMO_FIX.filter(f => f.status === '待審核').length, staff: asStaff ? ['王小美'] : people,
      stores: ['UCHINO - SOGO復興', 'UCHINO - 信義A8', 'Berkemann - SOGO復興', 'HASSIA - 新光南西', 'IKEUCHI - 板橋大遠百'] });
    if (p.action === 'q_today') return res({ ok: true, me, date: today, counts: { working: 3, off: 1, none: 1, leave: 1, abnormal: 2 }, people: [
      { name: '王小美', state: 'working', inTime: '10:52', outTime: '', store: 'UCHINO - SOGO復興', abnormal: [], inPhoto: 'demoIn01234' },
      { name: '林佳慧', state: 'working', inTime: '10:55', outTime: '', store: 'Berkemann - SOGO復興', abnormal: [] },
      { name: '陳怡君', state: 'working', inTime: '11:08', outTime: '', store: 'HASSIA - 新光南西', abnormal: ['11:08 上班：櫃點不符：UCHINO - 新光南西'] },
      { name: '張雅婷', state: 'off', inTime: '09:58', outTime: '14:02', store: 'UCHINO - 信義A8', abnormal: ['14:02 下班：定位可疑（誤差3m）'], inPhoto: 'demoIn01234', outPhoto: 'demoOut01234' },
      { name: '李珮瑜', state: 'none', inTime: '', outTime: '', store: '', abnormal: [] },
      { name: '黃詩涵', state: 'leave', inTime: '', outTime: '', store: '', abnormal: [] },
      { name: '游碧薈', state: 'off', inTime: '', outTime: '16:56', store: 'UCHINO - 信義A8', abnormal: [], outPhoto: 'demoOut01234' }] });
    if (p.action === 'q_photo') return res({ ok: true, photos: p.ids.map(id => ({ id, data: demoPhoto(id.indexOf('Out') > 0) })) });
    if (p.action === 'q_records') {
      let recs = [
        { date: today, time: '14:02', name: '張雅婷', store: 'UCHINO - 信義A8', type: '下班', verdict: '正常', distance: 42, accuracy: 3, warn: '定位可疑（誤差3m）', photo: '#', photoId: 'demoOut01234' },
        { date: today, time: '11:08', name: '陳怡君', store: 'HASSIA - 新光南西', type: '上班', verdict: '櫃點不符：UCHINO - 新光南西', distance: 12, accuracy: 35, warn: '', photo: '#' },
        { date: today, time: '10:55', name: '林佳慧', store: 'Berkemann - SOGO復興', type: '上班', verdict: '正常', distance: 60, accuracy: 28, warn: '', photo: '#' },
        { date: today, time: '10:52', name: '王小美', store: 'UCHINO - SOGO復興', type: '上班', verdict: '正常', distance: 38, accuracy: 41, warn: '', photo: '#' },
        { date: today, time: '09:58', name: '張雅婷', store: 'UCHINO - 信義A8', type: '上班', verdict: '正常', distance: 55, accuracy: 30, warn: '', photo: '#' }];
      if (asStaff) recs = recs.filter(r => r.name === '王小美').map(r => ({ date: r.date, time: r.time, name: r.name, store: r.store, type: r.type, verdict: r.verdict }));
      if (p.abnormal) recs = recs.filter(r => r.verdict !== '正常' || r.warn);
      if (p.name) recs = recs.filter(r => r.name === p.name);
      return res({ ok: true, me, records: recs });
    }
    if (p.action === 'q_hours') {
      const mk = (name, base) => {
        const days = []; let total = 0, miss = 0;
        for (let i = 1; i <= 12; i++) {
          if (i % 7 === 3) continue;

          if (h) total += h; if (flag) miss++;
          days.push({ date: d, in: '10:5' + (i % 9), out: flag ? '' : '21:' + pad(30 + (i % 20)), hours: h, flag, store: 'UCHINO - SOGO復興', abnormal: !asStaff && i === 9,

      };
